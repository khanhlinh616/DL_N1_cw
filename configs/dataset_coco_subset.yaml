dataset:
  name: "coco2017_subset"
  root_dir: "data/coco"
  train_images_dir: "data/coco/train2017"
  val_images_dir: "data/coco/val2017"
  annotations_dir: "data/coco/annotations"
  train_annotations_file: "data/coco/train_subset14k.json"
  val_heldout_annotations_file: "data/coco/val_heldout1k.json"
  test_val2017_annotations_file: "data/coco/annotations/instances_val2017.json"
  
split:
  seed: 42
  train_count: 14000
  val_heldout_count: 1000
  test_val2017_count: 5000

input:
  img_size: 512
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
